# 8889 控制台日志轮转（用户级，cron 每小时检查；状态文件 ~/.logrotate-console-status）
# 日志均为 O_APPEND 写入（启动脚本 >> / systemd append:），copytruncate 安全。
/home/ll/deploy/vllm-flash-next-w4a16.log /home/ll/deploy/server.log /home/ll/deploy/server-error.log {
    size 50M
    rotate 4
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
}
